services:
  web:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on: [api, ai]
  api:
    build: ./services/api
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=hireflow;Username=hireflow;Password=hireflow
      AllowedOrigins: http://localhost:3000
    ports: ["8080:8080"]
    depends_on: [db]
  ai:
    build: ./services/ai
    ports: ["8000:8000"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
